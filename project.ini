[data]
editorCommand = nvim .
lang = cpp
envCommand =

[terminal]
command = pm build 

[terminal_opencode]
command = opencode 

[run]
command = ./build/pm

[build]
prepare = cmake ..
directory = build
command = make -j12 


[script_install]
command = sudo make install
directory = build

[script_install_autocomplete]
command = ./install_autocomplete.sh 
directory = zsh

[script_clean]
command = rm -rf build
directory = .

[script_test]
command = ./build/unit_tests "~[terminal]"

[script_coverage]
command = bash scripts/coverage.sh

[script_test_terminals]
command = ./build/unit_tests

[script_dump]
command = python scripts/merge.py; cat all_code.txt | wl-copy

[script_test1]
command = echo test; pwd




